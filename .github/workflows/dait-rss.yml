name: dait-rss

on:
  schedule:
    # Ogni ora, al minuto 0 (orario UTC)
    - cron: "0 * * * *"
  workflow_dispatch: {}   # permette l'avvio manuale da GitHub

permissions:
  contents: write

concurrency:
  group: dait-rss
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Genera feed
        run: python scripts/generate_feed.py

      - name: Commit e push del feed aggiornato
        run: |
          git config user.name "dait-rss-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/items.json
          if git diff --cached --quiet; then
            echo "Nessuna novità, niente da committare."
          else
            git commit -m "Aggiorna feed RSS $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
